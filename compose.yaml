services:
  lumenrise-interface:
    build:
      context: .
      args:
        NEXT_PUBLIC_BLUX_APP_ID: ${NEXT_PUBLIC_BLUX_APP_ID}
        LUMENRISE_API_URL: ${LUMENRISE_API_URL:-https://api.lumenrise.app}
        NEXT_PUBLIC_STELLAR_HORIZON_URL: ${NEXT_PUBLIC_STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
        NEXT_PUBLIC_STELLAR_RPC_URL: ${NEXT_PUBLIC_STELLAR_RPC_URL:-https://soroban-testnet.stellar.org}
        NEXT_PUBLIC_FACTORY_CONTRACT_ID: ${NEXT_PUBLIC_FACTORY_CONTRACT_ID}
        NEXT_PUBLIC_USDC_CONTRACT_ID: ${NEXT_PUBLIC_USDC_CONTRACT_ID}
        NEXT_PUBLIC_XLM_CONTRACT_ID: ${NEXT_PUBLIC_XLM_CONTRACT_ID}
    ports:
      - '127.0.0.1:3001:3000'
    restart: unless-stopped
