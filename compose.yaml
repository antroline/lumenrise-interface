services:
  lumenrise-interface:
    image: lumenrise-interface
    pull_policy: never
    environment:
      LUMENRISE_API_URL: ${LUMENRISE_API_URL:-https://api.lumenrise.app}
    ports:
      - '127.0.0.1:3001:3000'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
